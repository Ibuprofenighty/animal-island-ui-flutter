name: animal_island_ui
description: A cozy Kawaii component library for Flutter inspired by Animal Crossing, featuring 36 components, 101 cute icons, and tactile 3D press depth.
version: 1.0.0
homepage: https://github.com/Ibuprofenighty/animal-island-ui-flutter
repository: https://github.com/Ibuprofenighty/animal-island-ui-flutter
issue_tracker: https://github.com/Ibuprofenighty/animal-island-ui-flutter/issues

environment:
  sdk: ">=3.13.4 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  characters: ^1.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.4.0
  yaml: ^3.1.2
  crypto: ^3.0.3
  path: ^1.9.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/CC-BY-NC-4.0-animal-island-upstream-75d0a745.txt
    - assets/licenses/OFL-Nunito.txt
    - assets/licenses/OFL-NotoSansSC.txt

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito[wght].ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC[wght].ttf
