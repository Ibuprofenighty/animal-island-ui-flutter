name: animal_island_ui
description: Original island-life Flutter components with scoped themes, accessible controls, and an independent interactive gallery.
version: 0.0.1
environment:
  sdk: '>=3.13.3 <4.0.0'
  flutter: '>=3.47.3'
dependencies:
  characters: ^1.4.1
  file_selector: 1.1.0
  desktop_drop: 0.8.4
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: IslandCodeMono
      fonts:
        - asset: assets/fonts/FiraCode-Variable.ttf
  assets:
    - assets/icons/
    - assets/scenes/
    - assets/licenses/
