name: island_gallery
description: Independent Windows and Web consumer of animal_island_ui.
publish_to: none
version: 0.0.1
environment:
  sdk: '>=3.13.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  animal_island_ui:
    path: ..
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_svg: 2.3.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/reference/
    - assets/photos/
  fonts:
    - family: IslandGalleryControls
      fonts:
        - asset: assets/fonts/Arimo-Variable.ttf
    - family: GROBOLD
      fonts:
        - asset: assets/fonts/GROBOLD.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito-latin-500-normal.ttf
          weight: 500
        - asset: assets/fonts/nunito-latin-700-normal.ttf
          weight: 700
        - asset: assets/fonts/nunito-latin-900-normal.ttf
          weight: 900
    - family: IslandGallerySans
      fonts:
        - asset: assets/fonts/IslandGallerySans-400.ttf
          weight: 400
        - asset: assets/fonts/IslandGallerySans-500.ttf
          weight: 500
        - asset: assets/fonts/IslandGallerySans-900.ttf
          weight: 900
