name: Gallery preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source contracts and Gallery version
        run: python -c "from tool.verify import policy; policy()"
      - name: Resolve library dependencies
        run: flutter pub get --enforce-lockfile
      - name: Resolve Gallery dependencies
        working-directory: example
        run: flutter pub get --enforce-lockfile
      - name: Test Gallery
        working-directory: example
        run: flutter test --no-pub
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Gallery
        working-directory: example
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-pub --no-web-resources-cdn --base-href "${BASE_PATH}/"
      - name: Upload Gallery
        uses: actions/upload-pages-artifact@v4
        with:
          path: example/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Gallery
        id: deployment
        uses: actions/deploy-pages@v4
