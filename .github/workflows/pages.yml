name: Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Gallery Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up locked toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get && cd ..

      - name: Stamp build identity
        run: dart run tool/build_info.dart --out build/build-info.json

      - name: Build Web Gallery
        run: |
          cd example
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-web-resources-cdn --dart-define-from-file=../build/build-info.json
          cd ..
          cp build/build-info.json example/build/web/build-info.json

      - name: Verify Web Build Artifacts
        run: |
          test -f example/build/web/index.html || exit 1
          test -f example/build/web/flutter_bootstrap.js || exit 1
          test -f example/build/web/build-info.json || exit 1
          test -d example/build/web/canvaskit || exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: example/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify deployed build identity
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sSf "${{ steps.deployment.outputs.page_url }}build-info.json" | grep -q '"commit": "${{ github.sha }}"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed build-info.json does not carry commit ${{ github.sha }}"
          exit 1
