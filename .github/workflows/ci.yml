name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up locked toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Verify Flutter SDK environment
        run: flutter doctor -v

      - name: Install root dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: |
          cd example
          flutter pub get
          cd ..

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/test example/integration_test

      - name: Analyze root package
        run: flutter analyze --fatal-infos

      - name: Analyze example package
        run: |
          cd example
          flutter analyze --fatal-infos
          cd ..

      - name: Verify Public API generation sync
        run: dart run tool/generate.dart --check

      - name: Verify documentation and skill generation sync
        run: dart run tool/generate_docs.dart --check

      - name: Run root unit and component tests with coverage
        run: flutter test --coverage

      - name: Run visual regression golden tests
        run: flutter test test/goldens

      - name: Run example gallery and story tests
        run: |
          cd example
          flutter test
          cd ..

      - name: Verify package integrity and clean consumer sandbox
        run: dart run tool/package_check.dart

      - name: Dry-run package publishing
        run: flutter pub publish --dry-run

  web-verification:
    name: Web Offline Bundling & Playwright Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up locked toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'true'

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get && cd ..
          npm --prefix tool/web ci

      - name: Install Playwright browsers
        run: npx --prefix tool/web playwright install --with-deps chromium

      - name: Stamp build identity
        run: dart run tool/build_info.dart --out build/build-info.json

      - name: Build Web Gallery
        run: |
          cd example
          flutter build web --release --base-href /animal-island-ui/ --no-web-resources-cdn --dart-define-from-file=../build/build-info.json
          cd ..
          cp build/build-info.json example/build/web/build-info.json

      - name: Run Playwright test suite
        run: npm --prefix tool/web test
